<!DOCTYPE html>
<html lang='en' data-theme='dark'>
<head>
  <meta charset='UTF-8' />
  <meta name='viewport' content='width=device-width, initial-scale=1.0' />
  <title>500 • Server Error • Xender-lite</title>
  <link rel='stylesheet' href='/font-icon/css/all.min.css' />
  <link rel='stylesheet' id='accent' href='/style/theme.css' />
  <link rel='icon' type='image/x-icon' href='/icon/logo.png' />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      letter-spacing: 0.01em;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(70px);
      opacity: 0.22;
      pointer-events: none;
      animation: drift 11s ease-in-out infinite;
    }

    .orb-1 {
      width: 270px; height: 270px;
      background: var(--danger);
      top: -70px; right: -40px;
    }

    .orb-2 {
      width: 180px; height: 180px;
      background: var(--warning);
      left: -20px; bottom: -40px;
      animation-delay: -3s;
    }

    .orb-3 {
      width: 140px; height: 140px;
      background: var(--accent);
      left: 22%; bottom: 30%;
      opacity: 0.12;
      animation-delay: -6s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(-25px, 24px) scale(1.05); }
      66% { transform: translate(20px, -18px) scale(0.94); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(440px, 90vw);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      text-align: center;
      padding: 48px 30px;
      animation: cardIn 0.7s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(22px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 72px; height: 72px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 18px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(239, 68, 68, 0.35);
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      font-size: 1.8rem;
      animation: pop 0.7s cubic-bezier(0.2, 0.9, 0.2, 1.1) both;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .bars {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 4px;
      height: 28px;
      margin-bottom: 16px;
      animation: fadeUp 0.6s ease both;
    }

    .bars span {
      width: 5px;
      border-radius: 999px;
      background: linear-gradient(to top, var(--danger), var(--warning));
      animation: pulseBar 1.2s ease-in-out infinite;
    }

    .bars span:nth-child(1) { height: 12px; animation-delay: 0s; }
    .bars span:nth-child(2) { height: 22px; animation-delay: 0.15s; }
    .bars span:nth-child(3) { height: 16px; animation-delay: 0.3s; }
    .bars span:nth-child(4) { height: 26px; animation-delay: 0.45s; }
    .bars span:nth-child(5) { height: 14px; animation-delay: 0.6s; }

    @keyframes pulseBar {
      0%, 100% { opacity: 0.5; transform: scaleY(0.7); }
      50% { opacity: 1; transform: scaleY(1); }
    }

    .code {
      margin-bottom: 8px;
      font-size: clamp(5rem, 18vw, 7.5rem);
      font-weight: 800;
      line-height: 0.9;
      letter-spacing: -0.06em;
      background: linear-gradient(135deg, var(--danger), var(--warning));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 16px rgba(239, 68, 68, 0.35));
      animation: shakeSoft 4s ease-in-out infinite;
    }

    @keyframes shakeSoft {
      0%, 100% { transform: rotate(0deg); filter: drop-shadow(0 0 14px rgba(239, 68, 68, 0.35)); }
      25% { filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.5)); }
      50% { transform: rotate(0.5deg); filter: drop-shadow(0 0 18px rgba(245, 158, 11, 0.42)); }
      75% { filter: drop-shadow(0 0 22px rgba(239, 68, 68, 0.48)); }
    }

    h1 {
      margin-bottom: 10px;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--text);
      animation: fadeUp 0.6s ease both;
    }

    p {
      margin-bottom: 28px;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.6;
      animation: fadeUp 0.6s ease 0.1s both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      animation: fadeUp 0.6s ease 0.15s both;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 18px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform var(--transition), border-color var(--transition), color var(--transition), box-shadow var(--transition);
      box-shadow: var(--shadow-sm);
    }

    .btn:hover {
      color: var(--accent);
      border-color: var(--border-hover);
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    .btn-primary {
      background: var(--gradient);
      border-color: transparent;
      color: #ffffff;
    }

    .btn-primary:hover {
      color: #ffffff;
      box-shadow: var(--shadow-glow);
    }

    .brand {
      margin-top: 28px;
      font-size: 0.78rem;
      color: var(--text-muted);
      animation: fadeUp 0.6s ease 0.2s both;
    }

    .brand span {
      color: var(--accent);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class='orb orb-1'></div>
  <div class='orb orb-2'></div>
  <div class='orb orb-3'></div>

  <div class='card'>
    <div class='icon-wrap'>
      <i class='fa-solid fa-triangle-exclamation'></i>
    </div>

    <div class='bars'>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class='code'>500</div>
    <h1>Server error</h1>
    <p>
      Something went wrong on our side.<br />
      Please try again in a moment.
    </p>

    <div class='actions'>
      <a class='btn btn-primary' href='javascript:location.reload()'>
        <i class='fa-solid fa-rotate'></i> Retry
      </a>
      <a class='btn' href='/files'>
        <i class='fa-solid fa-folder-open'></i> Go to Files
      </a>
      <a class='btn' href='javascript:history.back()'>
        <i class='fa-solid fa-arrow-left'></i> Go back
      </a>
    </div>

    <div class='brand'>
      <span>Xender-lite</span> · local file transfer
    </div>
  </div>

  <script src='/socket.io/socket.io.js'></script>
  <script src='/script/setting.js'></script>
  <script>
    const socket = io();

    socket.on('connect', () => {
      socket.emit('get-theme');
      socket.emit('get-accent');
    });

    socket.on('theme', (theme) => setTheme(theme));
    socket.on('accent', (accent) => setAccent(accent));
  </script>
</body>
</html>
