<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload • Xender-lite</title>
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="icon" type="image/x-icon" href="icon/logo.png">
  <script src="script/resumable.js"></script>
  <script src="script/socket/socket.io.min.js"></script>
  <style>
    * {
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-tertiary);
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      animation: fadeIn 0.35s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .app { margin: 0 auto; padding: 20px 16px 40px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    header div { display: flex; flex-direction: row; gap: 16px; align-items: center; }
    header div a {
      text-decoration: none; font-size: 1rem; font-weight: 500; color: var(--text-muted);
      transition: color var(--transition);
    }
    header div a:hover { color: var(--accent); }
    .status-pill {
      font-size: 0.8rem; padding: 5px 12px; border-radius: 0.7rem; color: var(--accent);
    }

    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius-lg, 16px);
      padding: 40px 20px; text-align: center; margin-bottom: 24px;
      transition: all var(--transition); cursor: pointer;
      background: var(--card);
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: var(--accent-soft);
      box-shadow: var(--shadow-glow);
    }
    .drop-zone .icon { font-size: 2.4rem; margin-bottom: 12px; }
    .drop-zone h3 { font-size: 1.05rem; margin-bottom: 6px; }
    .drop-zone p { font-size: 0.85rem; color: var(--text-muted); }

    .file-list { display: flex; flex-direction: column; gap: 12px; }

    .file-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      transition: border-color var(--transition), opacity 0.35s ease, transform 0.35s ease;
    }
    .file-card.uploading { border-color: var(--accent); }
    .file-card.paused    { border-color: var(--warning); }
    .file-card.success   { border-color: var(--success); }
    .file-card.error     { border-color: var(--danger); }
    .file-card.removing {
      opacity: 0; transform: translateX(24px) scale(0.98);
    }

    .file-header {
      display: flex; align-items: center; gap: 12px; margin-bottom: 10px;
    }
    .file-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; flex-shrink: 0; color: var(--accent);
    }
    .file-info { flex: 1; min-width: 0; }
    .file-info h4 {
      font-size: 0.92rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .file-info p { font-size: 0.78rem; color: var(--text-muted); }

    .file-actions { display: flex; gap: 6px; }
    .file-actions button {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      width: 34px; height: 34px; border-radius: 8px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition);
      padding: 0;
    }
    .file-actions button:hover {
      border-color: var(--accent); color: var(--accent);
    }
    .file-actions button svg { width: 16px; height: 16px; }

    .progress-wrap { margin-top: 4px; }
    .progress-bar {
      height: 6px; background: var(--bg-tertiary);
      border-radius: 999px; overflow: hidden; margin-bottom: 6px;
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 999px;
      transition: width 0.25s ease, background 0.3s ease;
      background: var(--accent);
    }
    .progress-fill.paused  { background: var(--warning); }
    .progress-fill.success { background: var(--success); }
    .progress-fill.error   { background: var(--danger); }

    .progress-meta {
      display: flex; justify-content: space-between;
      font-size: 0.75rem; color: var(--text-muted);
    }
    .empty {
      text-align: center; padding: 40px 20px;
      color: var(--text-muted); font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Upload Files</h1>
      <div>
        <a href="/">Home</a>
        <p class="status-pill" id="connectionStatus">Connecting…</p>
      </div>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="icon">📂</div>
      <h3>Drop files here</h3>
      <p>or click to browse · Resumable upload supported</p>
    </div>

    <div class="file-list" id="fileList">
      <div class="empty" id="emptyState">No files selected yet</div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="script/setting.js"></script>
  <script src="script/toast.js"></script>
  <script>
    const socket = io();
    const dropZone = document.getElementById('dropZone');
    const fileList = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');
    const connectionStatus = document.getElementById('connectionStatus');
    const fileUI = new Map();

    // SVG icons
    const SVG_PAUSE = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>`;
    const SVG_PLAY  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
    const SVG_CANCEL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;
    const SVG_RETRY = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;

    socket.on('connect', () => {
      connectionStatus.textContent = 'Connected';
      connectionStatus.style.color = 'var(--success)';
      socket.emit('start-live');
      // wireThemeSocket(socket);
    });

    socket.on('disconnect', () => {
      connectionStatus.textContent = 'Disconnected';
      connectionStatus.style.color = 'var(--danger)';
    });

    // Resumable
    const r = new Resumable({
      target: '/upload-file',
      chunkSize: 8 * 1024 * 1024,
      simultaneousUploads: 3,
      testChunks: true,
      query: { socketId: socket.id }
    });

    r.assignBrowse(dropZone);
    r.assignDrop(dropZone);

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragover');
    });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', () => dropZone.classList.remove('dragover'));

    function formatSize(bytes) {
      if (bytes === 0) return '0 B';
      const k = 1024;
      const sizes = ['B', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function getFileIcon(filename) {
      const ext = (filename || '').split('.').pop().toLowerCase();
      if (['jpg','jpeg','png','gif','webp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mkv','avi','mov'].includes(ext)) return '🎬';
      if (['mp3','wav','flac','aac'].includes(ext)) return '🎵';
      if (['pdf'].includes(ext)) return '📄';
      if (['zip','rar','7z'].includes(ext)) return '📦';
      return '📁';
    }

    function removeCardAnimated(card, id) {
      card.classList.add('removing');
      setTimeout(() => {
        card.remove();
        fileUI.delete(id);
        if (fileUI.size === 0) emptyState.style.display = 'block';
      }, 350);
    }

    function createFileCard(file) {
      emptyState.style.display = 'none';
      const card = document.createElement('div');
      card.className = 'file-card uploading';
      card.dataset.fileId = file.uniqueIdentifier;

      card.innerHTML = `
        <div class="file-header">
          <div class="file-icon">${getFileIcon(file.fileName)}</div>
          <div class="file-info">
            <h4 title="${file.fileName}">${file.fileName}</h4>
            <p>${formatSize(file.size)}</p>
          </div>
          <div class="file-actions">
            <button class="btn-pause" title="Pause">${SVG_PAUSE}</button>
            <button class="btn-cancel" title="Cancel">${SVG_CANCEL}</button>
          </div>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" style="width:0%"></div></div>
          <div class="progress-meta">
            <span class="percent">0%</span>
            <span class="speed">—</span>
          </div>
        </div>
      `;

      fileList.prepend(card);

      const fill = card.querySelector('.progress-fill');
      const percentEl = card.querySelector('.percent');
      const speedEl = card.querySelector('.speed');
      const pauseBtn = card.querySelector('.btn-pause');
      const cancelBtn = card.querySelector('.btn-cancel');

      pauseBtn.addEventListener('click', () => {
        if (file.isUploading()) {
          file.abort();
          card.classList.remove('uploading');
          card.classList.add('paused');
          fill.classList.add('paused');
          pauseBtn.innerHTML = SVG_PLAY;
          pauseBtn.title = 'Resume';
          socket.emit('upload:paused', { id: file.uniqueIdentifier, name: file.fileName });
        } else {
          file.retry();
          card.classList.remove('paused');
          card.classList.add('uploading');
          fill.classList.remove('paused');
          pauseBtn.innerHTML = SVG_PAUSE;
          pauseBtn.title = 'Pause';
          socket.emit('upload:resumed', { id: file.uniqueIdentifier, name: file.fileName });
        }
      });

      cancelBtn.addEventListener('click', () => {
        file.cancel();
        socket.emit('upload:cancelled', { id: file.uniqueIdentifier, name: file.fileName });
        removeCardAnimated(card, file.uniqueIdentifier);
      });

      fileUI.set(file.uniqueIdentifier, { card, fill, percentEl, speedEl, pauseBtn });
    }

    function markSuccess(file) {
      const ui = fileUI.get(file.uniqueIdentifier);
      if (!ui) return;
      ui.card.classList.remove('uploading', 'paused', 'error');
      ui.card.classList.add('success');
      ui.fill.classList.remove('paused', 'error');
      ui.fill.classList.add('success');
      ui.fill.style.width = '100%';
      ui.percentEl.textContent = '100%';
      ui.speedEl.textContent = 'Done';
      ui.pauseBtn.style.display = 'none';
    }

    r.on('fileAdded', (file) => {
      createFileCard(file);
      r.upload();
      socket.emit('upload:started', {
        id: file.uniqueIdentifier,
        name: file.fileName,
        size: file.size
      });
    });

    r.on('fileProgress', (file) => {
      const ui = fileUI.get(file.uniqueIdentifier);
      if (!ui) return;
      const progress = Math.floor(file.progress() * 100);
      ui.fill.style.width = progress + '%';
      ui.percentEl.textContent = progress + '%';
      const speed = file.averageSpeed || 0;
      ui.speedEl.textContent = speed > 0 ? formatSize(speed) + '/s' : '—';
      // Keep uploading state even after reconnect
      if (!ui.card.classList.contains('paused') && !ui.card.classList.contains('success')) {
        ui.card.classList.add('uploading');
        ui.card.classList.remove('error');
        ui.fill.classList.remove('error', 'paused');
      }
      socket.emit('upload:progress', {
        id: file.uniqueIdentifier,
        name: file.fileName,
        progress,
        speed
      });
    });

    r.on('fileSuccess', (file) => {
      markSuccess(file);
      socket.emit('upload:success', {
        id: file.uniqueIdentifier,
        name: file.fileName
      });
      // Animate out after a short delay
      setTimeout(() => {
        const ui = fileUI.get(file.uniqueIdentifier);
        if (ui) removeCardAnimated(ui.card, file.uniqueIdentifier);
      }, 2200);
    });

    r.on('fileError', (file, message) => {
      const ui = fileUI.get(file.uniqueIdentifier);
      if (!ui) return;
      ui.card.classList.remove('uploading', 'paused');
      ui.card.classList.add('error');
      ui.fill.classList.remove('paused', 'success');
      ui.fill.classList.add('error');
      ui.speedEl.textContent = 'Failed';
      ui.pauseBtn.innerHTML = SVG_RETRY;
      ui.pauseBtn.title = 'Retry';
      socket.emit('upload:error', {
        id: file.uniqueIdentifier,
        name: file.fileName,
        error: message
      });
    });

    // On reconnect, Resumable continues; ensure success class still applies via fileSuccess
    socket.on('connect', () =>{
      socket.emit('get-theme')
      socket.emit('get-accent')
      wireThemeSocket(socket)
      // Re-bind query with new socket id if needed
      if (r.opts) r.opts.query = { socketId: socket.id };
    })
    socket.on('theme', (t) => setTheme(t, false));
    socket.on('accent', (a) => setAccent(a, false));
  </script>
</body>
</html>
