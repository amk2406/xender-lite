<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="font-icon/css/all.min.css">
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="stylesheet" href="font-icon/css/all.min.css">
  <link rel="icon" href="icon/logo.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="script/socket/socket.io.min.js" as="script">
  <title>Devices • Xender-lite</title>
  <style>
    *{
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-tertiary);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      outline: none;
    }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent) 60%, transparent);
      border-radius: 10px;
    }
    ::-webkit-scrollbar {
      width: 6px;
      background: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .app {
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 8px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all var(--transition, 0.2s);
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .section-title {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius, 16px);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg-tertiary); }
    .device-icon {
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(34, 211, 238, 0.12);
      color: var(--accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }
    .device-info { flex: 1; min-width: 0; text-align: left; }
    .device-info h4 {
      font-size: 0.95rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .device-info p { font-size: 0.78rem; color: var(--text-muted); }
    .badge {
      font-size: 0.7rem; padding: 3px 8px; border-radius: 999px;
      background: rgba(34, 211, 238, 0.15); color: var(--accent);
      font-weight: 600;
    }
    .badge.offline { background: rgba(148,163,184,0.2); color: var(--text-muted); }
    .badge.connected { background: rgba(16,185,129,0.2); color: #34d399; }
    .connect-btn {
      padding: 8px 14px; border-radius: 10px; border: none;
      background: var(--gradient, linear-gradient(135deg, #22d3ee, #a78bfa));
      color: #000; font-weight: 600; font-size: 0.85rem;
      cursor: pointer; white-space: nowrap;
    }
    .connect-btn:disabled {
      opacity: 0.5; cursor: not-allowed;
    }
    .connect-btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .empty-state {
      padding: 40px 20px; text-align: center; color: var(--text-muted);
    }
    .empty-state .big { font-size: 2.5rem; margin-bottom: 10px; }
    .scan-bar {
      display: flex; gap: 10px; margin-bottom: 18px; align-items: center;
    }
    .scan-bar .status-text {
      font-size: 0.85rem; color: var(--text-muted); flex: 1;
    }
    .scan-bar .status-text.scanning { color: var(--accent); }
    .scan-btn {
      padding: 10px 16px; border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text); font-weight: 600; font-size: 0.85rem;
      cursor: pointer;
    }
    .scan-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.55);
      display: none; align-items: center; justify-content: center;
      z-index: 10000; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--card, #1e293b);
      border: 1px solid var(--border, #334155);
      border-radius: 16px;
      width: 100%; max-width: 360px;
      padding: 24px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
      text-align: left;
    }
    .modal h2 { font-size: 1.15rem; margin-bottom: 6px; }
    .modal .modal-sub {
      font-size: 0.85rem; color: var(--text-muted); margin-bottom: 18px;
    }
    .modal label {
      display: block; font-size: 0.8rem; color: var(--text-muted);
      margin-bottom: 6px;
    }
    .modal input[type="password"],
    .modal input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border, #334155);
      background: var(--bg, #0f172a);
      color: var(--text, #f1f5f9);
      font-size: 0.95rem;
      outline: none;
      margin-bottom: 8px;
    }
    .modal input:focus { border-color: var(--accent); }
    .modal .error-msg {
      color: #f87171; font-size: 0.8rem; min-height: 1.2em;
      margin-bottom: 12px;
    }
    .modal-actions {
      display: flex; gap: 10px; margin-top: 8px;
    }
    .modal-actions button {
      flex: 1; padding: 12px; border-radius: 10px;
      font-weight: 600; font-size: 0.95rem; cursor: pointer;
      border: none;
    }
    .modal-actions .cancel {
      background: transparent; border: 1px solid var(--border);
      color: var(--text);
    }
    .modal-actions .confirm {
      background: var(--gradient, linear-gradient(135deg, #22d3ee, #a78bfa));
      color: #000;
    }
    .modal-actions .confirm:disabled {
      opacity: 0.55; cursor: not-allowed;
    }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 10px 14px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text); text-decoration: none; font-size: 0.72rem;
      transition: color 0.15s;
    }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Devices</h1>
      <button class="icon-btn" id="refreshBtn" title="Scan again">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </header>

    <div class="scan-bar">
      <span class="status-text" id="scanStatus">Looking for devices on Wi‑Fi…</span>
      <button type="button" class="scan-btn" id="scanBtn">Scan</button>
    </div>

    <div class="section-title">Nearby on Wi‑Fi</div>
    <div class="card" id="deviceList">
      <div class="empty-state" id="emptyState">
        <div class="big"><i class="fa fa-wifi"></i></div>
        <p>No devices found yet.<br>Make sure devices are on the same network.</p>
      </div>
    </div>

    <div class="section-title">Connected</div>
    <div class="card" id="connectedList">
      <div class="empty-state" id="emptyConnected">
        <p>No active connections</p>
      </div>
    </div>
  </div>

  <!-- Password / connect dialog -->
  <div class="modal-overlay" id="connectModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Connect to device</h2>
      <p class="modal-sub" id="modalSub">Enter the transfer password if required.</p>
      <label for="passwordInput">Password (optional)</label>
      <input type="password" id="passwordInput" placeholder="Leave empty if none" autocomplete="current-password" />
      <div class="error-msg" id="modalError"></div>
      <div class="modal-actions">
        <button type="button" class="cancel" id="modalCancel">Cancel</button>
        <button type="button" class="confirm" id="modalConfirm">Connect</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="files" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Files
    </a>
    <a href="devices" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Devices
    </a>
    <a href="settings" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <script src="script/toast.js"></script>
  <script src="script/socket/socket.io.min.js"></script>
  <script src="script/setting.js"></script>
  <script>
    /** @type {Map<string, object>} */
    const devicesMap = new Map();
    /** @type {Map<string, object>} */
    const connectedMap = new Map();

    let pendingDevice = null;
    let connecting = false;

    const deviceListEl = document.getElementById('deviceList');
    const connectedListEl = document.getElementById('connectedList');
    const emptyState = document.getElementById('emptyState');
    const emptyConnected = document.getElementById('emptyConnected');
    const scanStatus = document.getElementById('scanStatus');
    const scanBtn = document.getElementById('scanBtn');
    const refreshBtn = document.getElementById('refreshBtn');

    const modal = document.getElementById('connectModal');
    const modalSub = document.getElementById('modalSub');
    const passwordInput = document.getElementById('passwordInput');
    const modalError = document.getElementById('modalError');
    const modalCancel = document.getElementById('modalCancel');
    const modalConfirm = document.getElementById('modalConfirm');

    function deviceId(d) {
      return String(d.id || d.ip || d.address || d.ssid || d.name);
    }

    function deviceIcon(d) {
      const t = (d.type || d.kind || '').toLowerCase();
      if (t.includes('phone') || t.includes('mobile') || t.includes('android') || t.includes('ios')) return '<i class="fa fa-mobile"></i>';
      if (t.includes('tablet')) return '<i class="fa fa-tablet"></i>';
      if (t.includes('tv')) return '<i class="fa fa-tv"></i>';
      return '<i class="fa fa-laptop"></i>';
    }

    function createDeviceRow(d, isConnected) {
      const id = deviceId(d);
      const row = document.createElement('div');
      row.className = 'list-item';
      row.dataset.id = id;

      const status = isConnected ? 'connected' : (d.online === false ? 'offline' : '');
      const badgeClass = status === 'connected' ? 'badge connected' : (status === 'offline' ? 'badge offline' : 'badge');
      const badgeText = status === 'connected' ? 'Connected' : (status === 'offline' ? 'Offline' : (d.signal || d.rssi ? 'Nearby' : 'Available'));

      row.innerHTML = `
        <div class="device-icon"></div>
        <div class="device-info">
          <h4></h4>
          <p></p>
        </div>
        <span class="${badgeClass}">${badgeText}</span>
        <button type="button" class="connect-btn ${isConnected ? 'secondary' : ''}"></button>
      `;
      row.querySelector('.device-icon').innerHTML = deviceIcon(d);
      row.querySelector('h4').textContent = d.name || d.hostname || d.ssid ||'Unknown device';
      const ip = d.ip || d.address || '';
      const extra = d.os || d.platform || '';
      row.querySelector('p').textContent = [ip, extra].filter(Boolean).join(' • ') || 'Wi‑Fi device';

      const btn = row.querySelector('.connect-btn');
      if (isConnected) {
        btn.textContent = 'Disconnect';
        btn.addEventListener('click', () => disconnectDevice(d));
      } else {
        btn.textContent = 'Connect';
        btn.addEventListener('click', () => openConnectDialog(d));
      }
      return row;
    }

    function renderNearby() {
      deviceListEl.querySelectorAll('.list-item').forEach((n) => n.remove());
      const list = Array.from(devicesMap.values()).filter((d) => !connectedMap.has(deviceId(d)));
      if (list.length === 0) {
        emptyState.style.display = 'block';
      } else {
        emptyState.style.display = 'none';
        list.forEach((d) => deviceListEl.appendChild(createDeviceRow(d, false)));
      }
    }

    function renderConnected() {
      connectedListEl.querySelectorAll('.list-item').forEach((n) => n.remove());
      const list = Array.from(connectedMap.values());
      if (list.length === 0) {
        emptyConnected.style.display = 'block';
      } else {
        emptyConnected.style.display = 'none';
        list.forEach((d) => connectedListEl.appendChild(createDeviceRow(d, true)));
      }
    }

    function upsertDevice(d) {
      if (!d) return;
      const id = deviceId(d);
      devicesMap.set(id, { ...devicesMap.get(id), ...d });
      if (d.connected) {
        connectedMap.set(id, devicesMap.get(id));
      }
      renderNearby();
      renderConnected();
    }

    function removeDevice(dOrId) {
      const id = typeof dOrId === 'object' ? deviceId(dOrId) : String(dOrId);
      devicesMap.delete(id);
      connectedMap.delete(id);
      renderNearby();
      renderConnected();
    }

    function openConnectDialog(device) {
      pendingDevice = device;
      modalError.textContent = '';
      passwordInput.value = '';
      modalSub.textContent = `Connect to “${device.name || device.hostname || device.ip || 'device'}”. Enter password if the host requires one.`;
      modal.classList.add('open');
      passwordInput.focus();
    }

    function closeModal() {
      modal.classList.remove('open');
      pendingDevice = null;
      connecting = false;
      modalConfirm.disabled = false;
      modalConfirm.textContent = 'Connect';
    }

    function submitConnect() {
      if (!pendingDevice || connecting) return;
      if (!socket.connected) {
        modalError.textContent = 'Not connected to server. Try again.';
        if (Toast) Toast.error('Server offline');
        return;
      }

      connecting = true;
      modalConfirm.disabled = true;
      modalConfirm.textContent = 'Connecting…';
      modalError.textContent = '';

      const payload = {
        id: pendingDevice.id || deviceId(pendingDevice),
        ip: pendingDevice.ip || pendingDevice.address,
        name: pendingDevice.name,
        password: passwordInput.value || undefined,
      };

      // Timeout safety
      const timeout = setTimeout(() => {
        if (!connecting) return;
        connecting = false;
        modalConfirm.disabled = false;
        modalConfirm.textContent = 'Connect';
        modalError.textContent = 'Connection timed out. Check the password and network.';
        if (Toast) Toast.error('Connection timed out');
      }, 15000);

      socket.emit('connect-device', payload, (ack) => {
        clearTimeout(timeout);
        // Optional callback-style ack from server
        if (ack) handleConnectResult(ack);
      });

      // Also listen once for result event (servers may not use ack)
      socket.once('connect-device-result', (res) => {
        clearTimeout(timeout);
        handleConnectResult(res);
      });
    }

    function handleConnectResult(res) {
      connecting = false;
      modalConfirm.disabled = false;
      modalConfirm.textContent = 'Connect';

      if (!res) {
        modalError.textContent = 'No response from server.';
        return;
      }

      if (res.ok || res.success || res.status === 'connected') {
        const dev = res.device || pendingDevice;
        if (dev) {
          const id = deviceId(dev);
          connectedMap.set(id, { ...dev, connected: true });
          devicesMap.set(id, connectedMap.get(id));
        }
        renderNearby();
        renderConnected();
        closeModal();
        if (Toast) {
          Toast.success(res.message || `Connected to ${dev && (dev.name || dev.ip) || 'device'}`);
        }
        return;
      }

      // Error cases
      const code = res.code || res.errorCode || '';
      let msg = res.error || res.message || 'Could not connect';
      if (code === 'WRONG_PASSWORD' || /password/i.test(msg)) {
        msg = 'Incorrect password. Please try again.';
      } else if (code === 'UNREACHABLE' || /unreachable|timeout/i.test(msg)) {
        msg = 'Device unreachable. Are you on the same Wi‑Fi?';
      } else if (code === 'BUSY') {
        msg = 'Device is busy. Try again in a moment.';
      } else if (code === 'REJECTED') {
        msg = 'Connection rejected by the other device.';
      }
      modalError.textContent = msg;
      if (Toast) Toast.error(msg);
    }

    function disconnectDevice(d) {
      if (!socket.connected) {
        if (Toast) Toast.error('Not connected to server',);
        return;
      }
      socket.emit('disconnect-device', {
        id: d.id || d.ssid || deviceId(d),
        ip: d.ip || d.address,
      });
      connectedMap.delete(deviceId(d));
      if (devicesMap.has(deviceId(d))) {
        devicesMap.set(deviceId(d), { ...devicesMap.get(deviceId(d)), connected: false });
      }
      renderNearby();
      renderConnected();
      if (Toast) Toast.info('Disconnected');
    }

    function startScan() {
      if (!socket.connected) {
        scanStatus.textContent = 'Server offline — reconnecting…';
        scanStatus.classList.remove('scanning');
        if (Toast) Toast.error('Not connected to server');
        return;
      }
      scanStatus.textContent = 'Scanning Wi‑Fi for devices…';
      scanStatus.classList.add('scanning');
      socket.emit('scan-wifi-devices');
      socket.emit('get-wifi-devices');
    }

    modalCancel.addEventListener('click', closeModal);
    modalConfirm.addEventListener('click', submitConnect);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') submitConnect();
      if (e.key === 'Escape') closeModal();
    });
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    scanBtn.addEventListener('click', startScan);
    refreshBtn.addEventListener('click', startScan);

    // ===== Socket =====
    const socket = io();
    wireThemeSocket(socket);

    socket.on('connect', () => {
      scanStatus.textContent = 'Connected — scanning…';
      scanStatus.classList.add('scanning');
      socket.emit('start-live');
      socket.emit('user-setting');
      socket.emit('scan-wifi-devices');
      socket.emit('get-wifi-devices');
      socket.emit('get-connected-devices');
      console.log('socket connected')
    });

    socket.on('disconnect', () => {
      scanStatus.textContent = 'Disconnected from server';
      scanStatus.classList.remove('scanning');
      if (Toast) Toast.warning('Disconnected from server');
    });

    socket.on('wifi-devices', (data) => {
      const list = Array.isArray(data) ? data : (data && data.devices) || [];
      devicesMap.clear();
      list.forEach((d) => {
        const id = deviceId(d);
        devicesMap.set(id, d);
        if (d.connected) connectedMap.set(id, d);
      });
      renderNearby();
      renderConnected();
      scanStatus.textContent = list.length
        ? `Found ${list.length} device(s)`
        : 'No devices found on this network';
      scanStatus.classList.remove('scanning');
    });

    socket.on('wifi-device', (d) => {
      upsertDevice(d);
      scanStatus.classList.remove('scanning');
    });

    socket.on('device-found', (d) => upsertDevice(d));
    socket.on('device-lost', (d) => removeDevice(d));
    socket.on('device-updated', (d) => upsertDevice(d));

    socket.on('connected-devices', (data) => {
      const list = Array.isArray(data) ? data : (data && data.devices) || [];
      connectedMap.clear();
      list.forEach((d) => connectedMap.set(deviceId(d), { ...d, connected: true }));
      renderConnected();
      renderNearby();
    });

    socket.on('connect-device-result', handleConnectResult);
    socket.on('device-connect-error', (err) => {
      const msg = (err && (err.message || err.error)) || 'Connection failed';
      if (modal.classList.contains('open')) {
        connecting = false;
        modalConfirm.disabled = false;
        modalConfirm.textContent = 'Connect';
        modalError.textContent = msg;
      }
      if (Toast) Toast.error(msg);
    });

    socket.on('scan-error', (err) => {
      const msg = (err && (err.message || err.error)) || 'Scan failed';
      scanStatus.textContent = msg;
      scanStatus.classList.remove('scanning');
      if (Toast) Toast.error(msg);
    });

    socket.on('scan-complete', (data) => {
      scanStatus.classList.remove('scanning');
      const n = (data && data.count) != null ? data.count : devicesMap.size;
      scanStatus.textContent = n ? `Found ${n} device(s)` : 'Scan complete — no devices';
    });
    socket.on('flash', () =>{
      console.log('close app emite')
      xenderNative.flash()
    })
    socket.on('close-app', () =>{
      xenderNative.close()
    })
  </script>
