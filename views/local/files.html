<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="font-icon/css/all.min.css">
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="icon" href="icon/logo.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <title>Files • Xender-lite</title>
  <style>
    * {
      scroll-behavior: smooth; scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-tertiary);
      margin: 0; padding: 0; box-sizing: border-box;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5;
      animation: pageIn 0.35s ease;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .app { margin: 0 auto; padding: 20px 16px 100px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; padding-top: 8px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border); background: var(--bg-secondary);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    .section-title {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin-bottom: 12px; padding-left: 4px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg, 16px); overflow: hidden; margin-bottom: 20px;
    }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-bottom: 1px solid var(--border);
      transition: background var(--transition), opacity 0.3s ease, transform 0.3s ease;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg-tertiary); }
    .list-item.removing {
      opacity: 0; transform: translateX(20px) scale(0.98);
    }
    .file-icon {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--accent-soft); color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0;
    }
    .file-info { flex: 1; min-width: 0; }
    .file-info h4 {
      font-size: 0.92rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .file-info p { font-size: 0.78rem; color: var(--text-muted); }
    .file-actions { display: flex; gap: 6px; }
    .file-actions button {
      background: transparent; border: 1px solid var(--border);
      color: var(--text-muted); cursor: pointer;
      width: 32px; height: 32px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      transition: all var(--transition); padding: 0;
    }
    .file-actions button:hover {
      color: var(--danger); border-color: var(--danger);
      background: rgba(239, 68, 68, 0.08);
    }
    .file-actions button svg { width: 14px; height: 14px; }
    .empty-state {
      padding: 36px 20px; text-align: center; color: var(--text-muted);
    }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      backdrop-filter: blur(12px); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; padding: 10px 14px;
      background: color-mix(in srgb, var(--bg) 85%, transparent); z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text); text-decoration: none; font-size: 0.72rem;
      transition: color var(--transition);
    }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Files</h1>
      <button class="icon-btn" id="refresh" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </header>

    <div class="section-title">Recent transfers</div>
    <div class="card" id="fileList">
      <div class="empty-state" id="emptyState">
        <p>No recent transfers yet.</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="files" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Files
    </a>
    <a href="devices" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Devices
    </a>
    <a href="settings" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <script src="script/toast.js"></script>
  <script src="script/socket/socket.io.min.js"></script>
  <script src="script/setting.js"></script>
  <script>
    const fileListEl = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');
    const socket = io();
    const transfers = new Map();

    const SVG_X = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6L6 18M6 6l12 12"/></svg>`;

    function itemKey(t) {
      return String(t.path || t.id || t.name || '');
    }

    function formatSize(bytes) {
      if (bytes == null) return '';
      const n = Number(bytes);
      if (Number.isNaN(n)) return String(bytes);
      if (n < 1024) return n + ' B';
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
      return (n / (1024 * 1024)).toFixed(1) + ' MB';
    }

    function iconFor(name) {
      const ext = (name || '').split('.').pop().toLowerCase();
      if (['png','jpg','jpeg','gif','webp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mkv','mov','webm','avi'].includes(ext)) return '🎬';
      if (['mp3','wav','flac','aac','ogg'].includes(ext)) return '🎵';
      if (ext === 'pdf') return '📕';
      if (['zip','rar','7z','tar','gz'].includes(ext)) return '📦';
      return '📄';
    }

    function createRow(t) {
      const key = itemKey(t);
      const row = document.createElement('div');
      row.className = 'list-item';
      row.dataset.key = key;
      row.innerHTML = `
        <div class="file-icon"></div>
        <div class="file-info"><h4></h4><p></p></div>
        <div class="file-actions">
          <button type="button" class="btn-remove" title="Remove">${SVG_X}</button>
        </div>
      `;
      row.querySelector('.file-icon').textContent = iconFor(t.name);
      row.querySelector('h4').textContent = t.name || 'Untitled';
      const meta = [formatSize(t.size), t.path].filter(Boolean).join(' · ');
      row.querySelector('p').textContent = meta || 'Recent transfer';

      row.querySelector('.btn-remove').addEventListener('click', () => {
        // EVENT → server: remove transfer by path + name
        socket.emit('remove-transfer', {
          path: t.path || '',
          name: t.name || '',
        });
        removeRowAnimated(key);
      });
      return row;
    }

    function removeRowAnimated(key) {
      transfers.delete(key);
      const el = fileListEl.querySelector(`.list-item[data-key="${CSS.escape(key)}"]`);
      if (el) {
        el.classList.add('removing');
        setTimeout(() => {
          el.remove();
          if (fileListEl.querySelectorAll('.list-item').length === 0) {
            emptyState.style.display = 'block';
          }
        }, 300);
      }
    }

    function renderList(list) {
      transfers.clear();
      fileListEl.querySelectorAll('.list-item').forEach((n) => n.remove());
      (list || []).forEach((t) => {
        const key = itemKey(t);
        if (!key) return;
        transfers.set(key, t);
        fileListEl.appendChild(createRow(t));
      });
      emptyState.style.display = transfers.size === 0 ? 'block' : 'none';
    }

    function upsert(t) {
      if (!t) return;
      const key = itemKey(t);
      if (!key) return;
      transfers.set(key, t);
      emptyState.style.display = 'none';
      const existing = fileListEl.querySelector(`.list-item[data-key="${CSS.escape(key)}"]`);
      const row = createRow(t);
      if (existing) existing.replaceWith(row);
      else fileListEl.prepend(row);
    }

    document.getElementById('refresh').addEventListener('click', () => {
      if (socket.connected) {
        // EVENT → server
        socket.emit('get-recent-transfers');
      }
    });

    socket.on('connect', () => {
      socket.emit('start-live');
      // EVENT → server: request recent transfers
      socket.emit('get-recent-transfers');
    });

    socket.on('disconnect', () => {
      if (window.Toast) Toast.warning('Disconnected from server');
    });

    // SERVER → client: full list of recent transfers
    // payload: array | { transfers: array }
    // each item: { name, path, size? }
    socket.on('recent-transfers', (data) => {
      const list = Array.isArray(data) ? data : (data && data.transfers) || [];
      renderList(list);
    });

    // SERVER → client: single transfer added/updated
    socket.on('transfer-added', (t) => upsert(t));
    socket.on('recent-transfer', (t) => upsert(t));

    // SERVER → client: confirm remove (optional; UI already animates on click)
    socket.on('transfer-removed', (data) => {
      const key = itemKey(data || {});
      if (key) removeRowAnimated(key);
    });

    /* ─── COMMENTED ───
    socket.on('theme', (t) => setTheme(t));
    socket.on('accent', (a) => setAccent(a));
    ─────────────────── */
  </script>
</body>
</html>
