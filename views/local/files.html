<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="font-icon/css/all.min.css">
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="icon" href="icon/logo.png" type="image/x-icon">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="script/socket/socket.io.min.js" as="script">
  <title>Files • Xender-lite</title>
  <style>
    *{
      scroll-behavior: smooth;
      scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-tertiary);
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    ::-webkit-scrollbar-thumb {
      background: color-mix(in srgb, var(--accent) 60%, transparent);
      border-radius: 10px;
    }
    ::-webkit-scrollbar { width: 6px; background: transparent; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      transition: background var(--transition), color var(--transition);
    }
    .app {
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      padding-top: 8px;
    }
    header h1 { font-size: 1.4rem; font-weight: 700; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
    .search-box { position: relative; margin-bottom: 18px; }
    .search-box input {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px 12px 42px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .search-box svg {
      position: absolute; left: 14px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      width: 18px; height: 18px;
    }
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      justify-content: space-around;
      align-items: center;
      padding-bottom: 4px;
      overflow-x: auto;
    }
    .drop-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius, 16px);
      padding: 32px 20px;
      text-align: center;
      margin-bottom: 20px;
      transition: all var(--transition);
      cursor: pointer;
    }
    .drop-zone.dragover {
      border-color: var(--accent);
      background: rgba(34, 211, 238, 0.06);
      box-shadow: var(--shadow-glow);
    }
    .drop-zone .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .drop-zone h3 { font-size: 1rem; margin-bottom: 4px; }
    .drop-zone p { font-size: 0.85rem; color: var(--text-muted); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius, 16px);
      overflow: hidden;
    }
    .list-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      transition: background var(--transition);
    }
    .list-item:last-child { border-bottom: none; }
    .list-item:hover { background: var(--bg-tertiary); }
    .list-item.hidden { display: none; }
    .file-icon {
      width: 42px; height: 42px; border-radius: 10px;
      background: var(--status, rgba(34,211,238,0.12));
      color: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.25rem; flex-shrink: 0;
    }
    .file-info { flex: 1; min-width: 0; }
    .file-info h4 {
      font-size: 0.92rem; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .file-info p { font-size: 0.78rem; color: var(--text-muted); }
    .file-info .path { font-size: 0.81rem; color: var(--text); text-overflow: ellipsis; display: flex; flex-direction: row; flex-wrap: nowrap; text-wrap: none; line-break: none;}
    .file-actions { display: flex; gap: 8px; }
    .file-actions button {
      background: transparent; border: none;
      color: var(--text-muted); cursor: pointer;
      padding: 6px; border-radius: 8px;
      transition: all var(--transition);
    }
    .file-actions button:hover {
      color: var(--accent); background: var(--status, rgba(34,211,238,0.12));
    }
    .empty-state {
      padding: 36px 20px; text-align: center; color: var(--text-muted);
    }
    .empty-state p { font-size: 0.95rem; }
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 10px 14px; margin: 0 auto;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
    }
    @media (max-width: 960px) {
      .tabs { gap: 5px; }
      .tab { padding: 8px 10px; gap: 5px; }
    }
    @media (max-width: 769px) {
      .tab { padding: 7px 9px; gap: 4px; flex-direction: column; }
    }
    @media (max-width: 549px) {
      .tab { padding: 5px 7px; gap: 3px; flex-direction: column; font-size: small; }
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text); text-decoration: none; font-size: 0.72rem;
      transition: color var(--transition);
    }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Files</h1>
      <button class="icon-btn" id="refresh" title="Refresh">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </header>

    <div class="drop-zone" id="dropZone">
      <div class="icon"><i class="fa fa-folder-open"></i></div>
      <h3>Click to select files</h3>
      <p>Select file to be send to others</p>
    </div>

    <div class="card" id="fileList">
      <div class="empty-state" id="emptyState">
        <p>No files yet. Select to add some.</p>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="files" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Files
    </a>
    <a href="devices" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Devices
    </a>
    <a href="settings" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <script src="script/toast.js"></script>
  <script src="script/socket/socket.io.min.js"></script>
  <script src="script/setting.js"></script>
  <script>
    // ===== File state =====
    const fileListEl = document.getElementById('fileList');
    const emptyState = document.getElementById('emptyState');
    const socket = io();
    const native = xenderNative
    const log = console.log
    const dropZone = document.getElementById('dropZone');
    let isconnected = false

    socket.on('connect', () => {
      console.log('Connected to server');
      socket.emit('start-live');
      socket.on('file-changed', ()=>location.reload())
      socket.on('is-connected', (conn)=>{
      if (conn) {
        isconnected = true
      }
      if (!conn) {
        isconnected = false
      }
    })
    
    });
    
    socket.on('disconnect', () => {
      if (Toast) Toast.warning('Disconnected from the main System');
    });

dropZone.addEventListener('click', (e) => {
        native.selectFiles({filters: '*'}).then(result => {
          if (result && result.data && result.data.files !== 0) {
            const files = result.data.files;
            if (!isconnected) Toast.warning(`No any connected device, connect and try again.`)
            if (Toast) Toast.info(`Sending ${result.data.files.length} files`);
            files.forEach(file => {
                socket.emit('send-file', file)
                log('sindind', file)
            });
          }
        })
      });
      socket.on('flash', () =>{
      console.log('close app emite')
      xenderNative.flash()
    })
      
    // ===== Socket.IO =====
    wireThemeSocket(socket);
      socket.on('close-app', () =>{
      xenderNative.close()
    })
    

</script>
</body>
</html>
