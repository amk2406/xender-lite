<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="font-icon/css/all.min.css">
  <link rel="icon" href="icon/logo.png">
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="manifest" href="manifest.json">
  <link rel="preload" href="script/socket/socket.io.min.js" as="script">
  <link rel="preload" href="script/splash-screen.js" as="script">
  <script src="script/splash-screen.js"></script>
  <title>Xender-lite</title>
  <style>
    * {
      scroll-behavior: smooth; scrollbar-width: thin;
      scrollbar-color: var(--accent) var(--bg-tertiary);
      margin: 0; padding: 0; box-sizing: border-box; outline: none;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    .app {
      margin: 0 auto;
      padding: 20px 16px 100px;
      animation: pageIn 0.4s ease;
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      padding-top: 8px;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.35rem;
    }
    .logo span {
      background: var(--gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .header-actions { display: flex; gap: 10px; }
    .icon-btn {
      width: 42px; height: 42px; border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
    }
    .icon-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--shadow-glow);
    }
    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 20px;
      text-align: center;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      transition: all var(--transition);
    }
    .hero h2 { font-size: 1.4rem; margin-bottom: 6px; }
    .hero p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }

    .qr-box {
      width: 220px; height: 220px;
      margin: 0 auto 16px;
      background: var(--bg);
      border-radius: 14px;
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      position: relative;
      transition: box-shadow var(--transition), border-color var(--transition);
    }
    .qr-box.has-qr {
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
    }
    .qr-box img {
      width: 100%; height: 100%;
      object-fit: contain;
      padding: 8px;
    }
    .qr-placeholder {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: var(--text-muted); font-size: 0.85rem; padding: 16px;
    }
    .qr-placeholder svg { opacity: 0.5; }

    .link-row {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .link-row.visible { display: flex; }
    .link-text {
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 12px;
      border-radius: 8px;
      max-width: 260px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: ui-monospace, monospace;
    }
    .copy-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-secondary);
      color: var(--text-muted);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: var(--shadow-sm);
    }
    .copy-btn.copied {
      border-color: var(--success);
      color: var(--success);
    }

    .status {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 0.85rem; color: var(--accent);
      background: var(--accent-soft);
      padding: 6px 14px; border-radius: 999px;
      margin-bottom: 18px;
    }
    .status::before {
      content: ""; width: 8px; height: 8px;
      background: var(--accent); border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    .status.offline { color: var(--text-muted); background: var(--bg-tertiary); }
    .status.offline::before { background: var(--text-muted); animation: none; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .web-btn {
      display: block; width: 100%; max-width: 280px; margin: 0 auto;
      padding: 14px 20px; border: none; border-radius: 12px;
      font-size: 1rem; font-weight: 600; cursor: pointer;
      transition: all var(--transition);
      background: var(--gradient); color: #000;
    }
    .web-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-glow);
    }
    .web-btn.running {
      background: transparent;
      border: 1.5px solid var(--danger);
      color: var(--danger);
    }
    .web-btn.running:hover {
      background: rgba(239, 68, 68, 0.1);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.25);
    }
    .web-btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

    .actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
      margin-bottom: 24px;
    }
    .action-btn {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 20px 12px;
      text-align: center; cursor: pointer;
      transition: all var(--transition); color: var(--text);
    }
    .action-btn:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-glow);
      transform: translateY(-2px);
    }
    .action-btn .icon { font-size: 1.5rem; margin-bottom: 8px; color: var(--accent); }
    .action-btn strong { display: block; font-size: 0.95rem; }
    .action-btn span { font-size: 0.78rem; color: var(--text-muted); }

    .section-title {
      font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--text-muted); margin-bottom: 12px; padding-left: 4px;
    }
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); overflow: hidden; margin-bottom: 20px;
    }
    .empty-transfers {
      padding: 28px 16px; text-align: center; color: var(--text-muted);
    }
    .empty-transfers button {
      margin-top: 12px; height: 44px; padding: 0 18px;
      border-radius: var(--radius); border: none;
      background: var(--bg); color: var(--text); cursor: pointer;
      box-shadow: var(--shadow-glow); font-weight: 600;
      transition: all var(--transition);
    }
    .empty-transfers button:hover { border-color: var(--accent); color: var(--accent); }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 10px 14px;
      background: color-mix(in srgb, var(--bg) 85%, transparent);
      z-index: 100;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      color: var(--text); text-decoration: none; font-size: 0.72rem;
      transition: color var(--transition);
    }
    .nav-item.active, .nav-item:hover { color: var(--accent); }
    .nav-item svg { width: 22px; height: 22px; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="logo"><span>Xender-lite</span></div>
      <div class="header-actions">
        <button class="icon-btn" title="Settings" onclick="location.href='settings'">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="hero" id="heroPanel">
      <h2 id="heroTitle">Ready to share</h2>
      <p id="heroSub">Start the web server so phones can connect</p>

      <div class="qr-box" id="qrBox">
        <div class="qr-placeholder" id="qrPlaceholder">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v6M14 20h6"/>
          </svg>
          <span>Start Web to show QR</span>
        </div>
        <img id="qrImage" src="" alt="QR Code" style="display:none;" />
      </div>

      <div class="link-row" id="linkRow">
        <span class="link-text" id="linkText"></span>
        <button type="button" class="copy-btn" id="copyBtn" title="Copy link">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>
      </div>

      <div class="status offline" id="connStatus">Web server off</div>

      <button type="button" class="web-btn" id="webBtn">Start Web</button>
    </div>

    <div class="actions">
      <button class="action-btn" onclick="location.href='files'">
        <div class="icon"><i class="fa far fa-folder-open"></i></div>
        <strong>Send Files</strong>
        <span>Browse & share</span>
      </button>
      <button class="action-btn" onclick="location.href='devices'">
        <div class="icon"><i class="fa fa-file-arrow-down"></i></div>
        <strong>Devices</strong>
        <span>Nearby & connected</span>
      </button>
    </div>

    <div class="section-title">Incoming transfers</div>
    <div class="card" id="transfersCard">
      <div class="empty-transfers" id="emptyTransfers">
        <p>No incoming transfers</p>
        <button type="button" onclick="location.href='devices'">Find a device</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="/" class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </a>
    <a href="files" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Files
    </a>
    <a href="devices" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      Devices
    </a>
    <a href="settings" class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <script src="script/toast.js"></script>
  <script src="script/socket/socket.io.min.js"></script>
  <script src="script/setting.js"></script>
  <script>
    const socket = io();
    let webServerRunning = false;
    let currentLink = '';

    const webBtn = document.getElementById('webBtn');
    const connStatus = document.getElementById('connStatus');
    const qrBox = document.getElementById('qrBox');
    const qrImage = document.getElementById('qrImage');
    const qrPlaceholder = document.getElementById('qrPlaceholder');
    const linkRow = document.getElementById('linkRow');
    const linkText = document.getElementById('linkText');
    const copyBtn = document.getElementById('copyBtn');
    const heroTitle = document.getElementById('heroTitle');
    const heroSub = document.getElementById('heroSub');
   
    function ensureHttp(url) {
      if (!url) return '';
      const s = String(url).trim();
      if (/^https?:\/\//i.test(s)) return s;
      return 'http://' + s;
    }

    function setQr(dataUrl) {
      if (!dataUrl) {
        qrImage.style.display = 'none';
        qrPlaceholder.style.display = 'flex';
        qrBox.classList.remove('has-qr');
        return;
      }
      console.log(dataUrl)
      qrImage.src = dataUrl;
      qrImage.style.display = 'block';
      qrPlaceholder.style.display = 'none';
      qrBox.classList.add('has-qr');
    }

    function setLink(link) {
      currentLink = ensureHttp(link);
      if (currentLink) {
        linkText.textContent = currentLink;
        linkRow.classList.add('visible');
      } else {
        linkRow.classList.remove('visible');
        linkText.textContent = '';
      }
    }

    function setRunningUI(running) {
      webServerRunning = running;
      if (running) {
        webBtn.textContent = 'Close Web Server';
        webBtn.classList.add('running');
        connStatus.textContent = 'Web server running';
        connStatus.classList.remove('offline');
        heroTitle.textContent = 'Sharing over Wi‑Fi';
        heroSub.textContent = 'Scan the QR or open the link on your phone';
      } else {
        webBtn.textContent = 'Start Web';
        webBtn.classList.remove('running');
        connStatus.textContent = 'Web server off';
        connStatus.classList.add('offline');
        heroTitle.textContent = 'Ready to share';
        heroSub.textContent = 'Start the web server so phones can connect';
        setQr(null);
        setLink('');
      }
    }

    webBtn.addEventListener('click', () => {
      if (!socket.connected) {
        if (window.Toast) Toast.error('Not connected to server');
        return;
      }
      webBtn.disabled = true;
      if (webServerRunning) {
        // EVENT → server: stop the web server
        socket.emit('stop-web-server');
      } else {
        // EVENT → server: start the web server (port decided by server, e.g. 30 or configured)
        socket.emit('start-web-server');
      }
      setTimeout(() => { webBtn.disabled = false; }, 1500);
    });

    copyBtn.addEventListener('click', async () => {
      if (!currentLink) return;
      try {
        await navigator.clipboard.writeText(currentLink);
        copyBtn.classList.add('copied');
        if (window.Toast) Toast.success('Link copied', 1800);
        setTimeout(() => copyBtn.classList.remove('copied'), 2000);
      } catch (_) {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = currentLink;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
        copyBtn.classList.add('copied');
        if (window.Toast) Toast.success('Link copied', 1800);
        setTimeout(() => copyBtn.classList.remove('copied'), 2000);
      }
    });

    // ===== Socket =====
    socket.on('connect', () => {
      // socket.emit('user-setting');
      // socket.emit('get-incoming-transfers');
      //if (window.Toast) Toast.success('Connected', 1600);
    });

    socket.on('disconnect', () => {
      //if (window.Toast) Toast.warning('Disconnected from server');
    });

    // SERVER → client: web server started
    // payload example: { link: '192.168.1.5:30', qr: 'data:image/png;base64,...' }
    socket.on('web-server-started', (data) => {
      setRunningUI(true);
      console.log('webstart ', data)
      if (data) {
        if (data.link || data.url || data.host) setLink(data.link || data.url || data.host);
        if (data.qr || data.dataUrl || data.qrCode) setQr(data.qr || data.dataUrl || data.qrCode);
      }
      if (window.Toast) Toast.success('Web server started');
    });

    // SERVER → client: web server stopped / closed
    socket.on('web-server-stopped', () => {
      setRunningUI(false);
      if (window.Toast) Toast.info('Web server stopped');
    });
    // alias
    socket.on('web-server-closed', () => {
      setRunningUI(false);
    });

    // SERVER → client: QR image update
    // payload: string dataUrl OR { dataUrl | url | qr }
    socket.on('qr-code', (data) => {
      console.log(data)
      if (typeof data === 'string') setQr(data);
      else if (data && (data.dataUrl || data.url || data.qr)) setQr(data.dataUrl || data.url || data.qr);
    });

    // SERVER → client: LAN link / address
    // payload: string OR { link | url | ip }
    socket.on('lan-link', (link) => {
      const v = typeof link === 'string' ? link : (link && (link.link || link.url || link.ip));
      if (v) setLink(v);
    });
    socket.on('theme', (t) => setTheme(t));
    socket.on('accent', (a) => setAccent(a));
    /* ─── COMMENTED: re-enable when wiring server ───
    

    socket.on('incoming-transfer', (data) => { ... });
    socket.on('transfer-progress', (data) => { ... });
    socket.on('transfer-complete', (data) => { ... });
    socket.on('transfer-error', (data) => { ... });
    socket.on('transfer-remove', (data) => { ... });
    socket.on('incoming-transfers', (list) => { ... });
    socket.on('connection-status', (data) => { ... });
    ──────────────────────────────────────────────── */
  </script>
</body>
</html>
