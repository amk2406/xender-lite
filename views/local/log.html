<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" id="accent" href="style/theme.css">
  <link rel="icon" href="icon/logo.png" type="image/x-icon">
  <title>Logs • Xender-lite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; overflow: hidden;
      display: flex; flex-direction: column;
    }
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--card); flex-shrink: 0;
    }
    .back-btn {
      width: 36px; height: 36px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--bg-secondary);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all var(--transition);
    }
    .back-btn:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 1.15rem; font-weight: 700; flex: 1; }
    .layout {
      display: flex; flex: 1; min-height: 0;
      animation: fillIn 0.4s ease;
    }
    @keyframes fillIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .sidebar {
      width: 240px; flex-shrink: 0;
      border-right: 1px solid var(--border);
      background: var(--bg-secondary);
      overflow-y: auto; padding: 12px 0;
    }
    .sidebar-item {
      padding: 10px 16px; cursor: pointer;
      font-size: 0.88rem; color: var(--text-muted);
      border-left: 3px solid transparent;
      transition: all 0.15s; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .sidebar-item:hover { background: var(--bg-tertiary); color: var(--text); }
    .sidebar-item.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .sidebar-empty {
      padding: 24px 16px; text-align: center;
      color: var(--text-muted); font-size: 0.85rem;
    }
    .content {
      flex: 1; overflow: auto; padding: 0;
      background: var(--bg);
    }
    .content pre {
      margin: 0; padding: 16px 20px;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.82rem; line-height: 1.55;
      white-space: pre-wrap; word-break: break-word;
      min-height: 100%;
      animation: fillIn 0.3s ease;
    }
    .content .placeholder {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: var(--text-muted); font-size: 0.95rem;
    }
    /* highlight.js basic theme using CSS vars */
    .hljs { background: transparent; color: var(--text); }
    .hljs-keyword, .hljs-selector-tag { color: var(--accent); }
    .hljs-string, .hljs-attr { color: var(--accent-secondary, #A855F7); }
    .hljs-number, .hljs-literal { color: var(--warning); }
    .hljs-comment { color: var(--text-muted); font-style: italic; }
    .hljs-built_in, .hljs-type { color: var(--success); }
    .hljs-title, .hljs-section { color: var(--accent-hover); font-weight: 600; }
    .hljs-meta { color: var(--text-secondary); }

    @media (max-width: 640px) {
      .sidebar { width: 160px; }
      .sidebar-item { font-size: 0.8rem; padding: 8px 12px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button type="button" class="back-btn" onclick="history.back()" title="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1>App Logs</h1>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-empty" id="sidebarEmpty">Loading logs…</div>
    </aside>
    <main class="content" id="content">
      <div class="placeholder" id="placeholder">Select a log file</div>
    </main>
  </div>

  <script src="script/socket/socket.io.min.js"></script>
  <script src="script/setting.js"></script>
  <script src="script/highlight.min.js"></script>
  <script src="script/toast.js"></script>
  <script>
    const socket = io();
    const sidebar = document.getElementById('sidebar');
    const sidebarEmpty = document.getElementById('sidebarEmpty');
    const content = document.getElementById('content');
    const placeholder = document.getElementById('placeholder');
    let activeName = null;
    const logFiles = [];

    function renderSidebar() {
      sidebar.querySelectorAll('.sidebar-item').forEach((n) => n.remove());
      if (logFiles.length === 0) {
        sidebarEmpty.style.display = 'block';
        sidebarEmpty.textContent = 'No log files';
        return;
      }
      sidebarEmpty.style.display = 'none';
      logFiles.forEach((name) => {
        const item = document.createElement('div');
        item.className = 'sidebar-item' + (name === activeName ? ' active' : '');
        item.textContent = name;
        item.title = name;
        item.addEventListener('click', () => selectLog(name));
        sidebar.appendChild(item);
      });
    }

    function selectLog(name) {
      activeName = name;
      renderSidebar();
      placeholder.style.display = 'none';
      // EVENT → server: request log content
      socket.emit('get-log', { name });
      // Also try HTTP fallback
      fetch('/log?name=' + encodeURIComponent(name))
        .then(async (res) => {
          if (res.status === 404) {
            const idx = logFiles.indexOf(name);
            if (idx >= 0) logFiles.splice(idx, 1);
            renderSidebar();
            content.innerHTML = '<div class="placeholder">Log not found</div>';
            return;
          }
          const text = await res.text();
          showLog(text);
        })
        .catch(() => { /* socket will handle */ });
    }

    function showLog(text) {
      const pre = document.createElement('pre');
      pre.className = 'hljs';
      pre.textContent = text || '(empty)';
      content.innerHTML = '';
      content.appendChild(pre);
      if (window.hljs) {
        try { hljs.highlightElement(pre); } catch (_) {}
      }
    }

    socket.on('connect', () => {
      // EVENT → server: request list of log files
      socket.emit('get-log-list');
    });

    // SERVER → client: list of log file names
    // payload: string[] | { logs: string[] }
    socket.on('log-list', (data) => {
      const list = Array.isArray(data) ? data : (data && data.logs) || [];
      logFiles.length = 0;
      list.forEach((n) => logFiles.push(String(n)));
      renderSidebar();
    });

    // SERVER → client: log file content
    // payload: { name, content } | string
    socket.on('log-content', (data) => {
      const text = typeof data === 'string' ? data : (data && data.content) || '';
      showLog(text);
    });

    /* ─── COMMENTED ───
    socket.on('theme', (t) => setTheme(t));
    socket.on('accent', (a) => setAccent(a));
    ─────────────────── */
  </script>
</body>
</html>
